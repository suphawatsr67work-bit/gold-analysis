name: Update economic calendar

on:
  schedule:
    - cron: '7 * * * *'      # ทุกชั่วโมง
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news.yml'

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch calendar (this week + next week)
        run: |
          set -e
          mkdir -p /tmp/ff
          curl -fsS -A "Mozilla/5.0" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o /tmp/ff/this.json
          curl -fsS -A "Mozilla/5.0" "https://nfs.faireconomy.media/ff_calendar_nextweek.json" -o /tmp/ff/next.json || echo '[]' > /tmp/ff/next.json
          python3 - <<'PY'
          import json, datetime
          def load(p):
              try:
                  d = json.load(open(p, encoding="utf-8"))
                  return d if isinstance(d, list) else []
              except Exception:
                  return []
          ev = load("/tmp/ff/this.json") + load("/tmp/ff/next.json")
          if not ev:
              raise SystemExit("no events fetched")
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "events": ev}
          json.dump(out, open("news.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("events:", len(ev))
          PY

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update news.json" && git push; fi
